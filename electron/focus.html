<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Mode</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: rgba(30, 30, 46, 0.95);
    --border: #313244;
    --text: #cdd6f4;
    --text-muted: #a6adc8;
    --text-dim: #585b70;
    --btn-bg: #313244;
    --btn-hover: #45475a;
    --accent: #89b4fa;
    --danger: #f38ba8;
    --warn: #f9e2af;
    --success: #a6e3a1;
    --progress-bg: #313244;
  }
  [data-theme="light"] {
    --bg: rgba(245, 245, 249, 0.95);
    --border: #d4d4d8;
    --text: #1e1e2e;
    --text-muted: #52525b;
    --text-dim: #a1a1aa;
    --btn-bg: #e8e8ee;
    --btn-hover: #d4d4d8;
    --accent: #3b82f6;
    --danger: #ef4444;
    --warn: #eab308;
    --success: #22c55e;
    --progress-bg: #e8e8ee;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    color: var(--text);
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }
  .titlebar {
    display: flex;
    justify-content: flex-end;
    gap: 4px;
    padding: 6px 8px 0;
    -webkit-app-region: no-drag;
  }
  .titlebar button {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s;
    opacity: 0.5;
  }
  .titlebar button:hover { opacity: 1; }
  .titlebar .close-btn { background: var(--danger); color: var(--warn); }
  .titlebar .min-btn { background: var(--warn); color: #1e1e2e; }
  .container {
    height: calc(100vh - 32px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 16px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 4px;
    backdrop-filter: blur(12px);
    gap: 10px;
  }
  .icon {
    font-size: 28px;
    line-height: 1;
  }
  .task-name {
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    color: var(--text);
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .task-name.no-task {
    color: var(--text-muted);
    font-weight: 400;
    font-style: italic;
  }
  .elapsed {
    font-size: 40px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    color: var(--accent);
    -webkit-app-region: no-drag;
  }
  .progress-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .progress-bar-bg {
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: var(--progress-bg);
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--accent);
    transition: width 1s linear;
  }
  .progress-label {
    font-size: 10px;
    color: var(--text-dim);
    text-align: center;
  }
  .controls {
    display: flex;
    gap: 8px;
    -webkit-app-region: no-drag;
  }
  .controls button {
    background: var(--btn-bg);
    border: none;
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .controls button:hover { background: var(--btn-hover); }
  .controls button.danger { color: var(--danger); }
  .no-timer-msg {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    padding: 0 8px;
  }
</style>
</head>
<body>
<div class="titlebar">
  <button class="min-btn" id="minBtn" title="Minimize">—</button>
  <button class="close-btn" id="closeBtn" title="Close">✕</button>
</div>
<div class="container">
  <div class="icon">🎯</div>
  <div class="task-name no-task" id="taskName">No timer running</div>
  <div class="elapsed" id="elapsed">00:00</div>
  <div class="progress-wrap" id="progressWrap" style="display:none">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="progress-label" id="progressLabel">0% of 2h goal</div>
  </div>
  <div class="no-timer-msg" id="noTimerMsg">Start a timer from the Tasks page to begin tracking focus time.</div>
  <div class="controls" id="controls" style="display:none">
    <button class="danger" id="stopBtn" title="Stop timer">⏹</button>
  </div>
</div>

<script>
  ;(async function loadTheme() {
    try {
      const theme = await window.electronAPI.getTheme()
      document.documentElement.setAttribute('data-theme', theme)
    } catch (e) { /* use default dark */ }
  })()

  ;(function listenThemeChanges() {
    try {
      window.electronAPI.onThemeChanged((theme) => {
        document.documentElement.setAttribute('data-theme', theme)
      })
    } catch (e) {}
  })()

  const DAILY_GOAL_SECONDS = 2 * 60 * 60  // 2 hours

  const elapsedEl    = document.getElementById('elapsed')
  const taskNameEl   = document.getElementById('taskName')
  const progressWrap = document.getElementById('progressWrap')
  const progressFill = document.getElementById('progressFill')
  const progressLabel= document.getElementById('progressLabel')
  const noTimerMsg   = document.getElementById('noTimerMsg')
  const controlsEl   = document.getElementById('controls')
  const stopBtn      = document.getElementById('stopBtn')
  const closeBtn     = document.getElementById('closeBtn')
  const minBtn       = document.getElementById('minBtn')

  let startTime = null
  let elapsedSeconds = 0
  let dailyTotalSeconds = 0
  let tickInterval = null

  function formatElapsed(seconds) {
    const h = Math.floor(seconds / 3600)
    const m = Math.floor((seconds % 3600) / 60)
    const s = seconds % 60
    if (h > 0) {
      return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0')
    }
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0')
  }

  function formatGoal(seconds) {
    const h = Math.floor(seconds / 3600)
    const m = Math.floor((seconds % 3600) / 60)
    if (h > 0 && m > 0) return h + 'h ' + m + 'm'
    if (h > 0) return h + 'h'
    return m + 'm'
  }

  function updateProgress() {
    const totalFocus = dailyTotalSeconds + elapsedSeconds
    const pct = Math.min(100, Math.round((totalFocus / DAILY_GOAL_SECONDS) * 100))
    progressFill.style.width = pct + '%'
    progressLabel.textContent = pct + '% of ' + formatGoal(DAILY_GOAL_SECONDS) + ' goal'
  }

  function tick() {
    if (!startTime) return
    elapsedSeconds = Math.floor((Date.now() - startTime) / 1000)
    elapsedEl.textContent = formatElapsed(elapsedSeconds)
    updateProgress()
  }

  function showRunning(entry) {
    startTime = new Date(entry.start_time).getTime()
    elapsedSeconds = Math.floor((Date.now() - startTime) / 1000)

    taskNameEl.textContent = entry.task_name || ('Task #' + entry.task_id)
    taskNameEl.classList.remove('no-task')
    elapsedEl.textContent = formatElapsed(elapsedSeconds)
    progressWrap.style.display = ''
    noTimerMsg.style.display = 'none'
    controlsEl.style.display = ''

    updateProgress()

    if (tickInterval) clearInterval(tickInterval)
    tickInterval = setInterval(tick, 1000)
  }

  function showIdle() {
    startTime = null
    elapsedSeconds = 0
    if (tickInterval) { clearInterval(tickInterval); tickInterval = null }

    taskNameEl.textContent = 'No timer running'
    taskNameEl.classList.add('no-task')
    elapsedEl.textContent = '00:00'
    progressWrap.style.display = 'none'
    noTimerMsg.style.display = ''
    controlsEl.style.display = 'none'
  }

  // Load initial state
  ;(async function init() {
    try {
      const today = new Date().toISOString().split('T')[0]
      const [entry, total] = await Promise.all([
        window.electronAPI.getRunning(),
        window.electronAPI.getTotalToday(today),
      ])
      dailyTotalSeconds = total || 0
      if (entry) {
        showRunning(entry)
      } else {
        showIdle()
      }
    } catch (e) {
      showIdle()
    }
  })()

  // Listen for timer updates pushed from main process
  try {
    window.electronAPI.onTimerUpdate((entry) => {
      if (entry) {
        showRunning(entry)
      } else {
        showIdle()
      }
    })
  } catch (e) {}

  stopBtn.addEventListener('click', async () => {
    try {
      await window.electronAPI.stopTimer()
      showIdle()
    } catch (e) {}
  })

  closeBtn.addEventListener('click', () => {
    try { window.electronAPI.close() } catch (e) {}
  })
  minBtn.addEventListener('click', () => {
    try { window.electronAPI.minimize() } catch (e) {}
  })
</script>
</body>
</html>
