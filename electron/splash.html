<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibe Tasks</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root,
  [data-theme="dark"] {
    --bg: #1e1e2e;
    --text: #cdd6f4;
    --text-muted: #a6adc8;
    --accent: #89b4fa;
  }
  [data-theme="light"] {
    --bg: #f5f5f9;
    --text: #1e1e2e;
    --text-muted: #52525b;
    --accent: #3b82f6;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    user-select: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 32px;
  }
  .logo {
    width: 96px;
    height: 96px;
    animation: fadeIn 0.6s ease-out;
  }
  .title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    animation: fadeIn 0.6s ease-out 0.1s both;
  }
  .subtitle {
    font-size: 14px;
    color: var(--text-muted);
    animation: fadeIn 0.6s ease-out 0.2s both;
  }
  .loader {
    margin-top: 8px;
    display: flex;
    gap: 8px;
    animation: fadeIn 0.6s ease-out 0.3s both;
  }
  .loader span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .loader span:nth-child(2) { animation-delay: 0.2s; }
  .loader span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="container">
    <svg class="logo" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="256" height="256" rx="48" fill="#6366F1"/>
      <rect x="32" y="48" width="192" height="160" rx="16" fill="white" fill-opacity="0.15"/>
      <circle cx="80" cy="100" r="16" fill="#F472B6"/>
      <circle cx="128" cy="100" r="16" fill="#22D3EE"/>
      <circle cx="176" cy="100" r="16" fill="#FBBF24"/>
      <rect x="56" y="136" width="144" height="12" rx="6" fill="white" fill-opacity="0.3"/>
      <rect x="56" y="160" width="100" height="12" rx="6" fill="white" fill-opacity="0.2"/>
      <circle cx="200" cy="200" r="32" fill="#F472B6"/>
      <path d="M200 176V200L212 208" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1 class="title">Vibe Tasks</h1>
    <p class="subtitle" id="version">Desktop Task Management</p>
    <div class="loader" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search)
    const theme = params.get('theme')
    if (theme === 'light' || theme === 'dark') {
      document.documentElement.setAttribute('data-theme', theme)
    }
    const version = params.get('version')
    if (version) {
      document.getElementById('version').textContent = 'Version ' + version
    }
  </script>
</body>
</html>
