appId: com.vibetasks.app
productName: Vibe Tasks
copyright: Copyright © 2026

directories:
  output: build
  buildResources: assets

files:
  - dist/**/*
  - dist-electron/**/*
  - "!node_modules/**/*"
  - node_modules/sql.js/**/*
  - node_modules/react/**/*
  - node_modules/react-dom/**/*
  - node_modules/scheduler/**/*
  - node_modules/react-router-dom/**/*
  - node_modules/@remix-run/**/*

extraResources:
  - from: "dist-electron/"
    to: "electron/"
    filter:
      - "*.cjs"
      - "*.html"
  - from: "."
    to: "."
    filter:
      - "xylophone.mp3"

asar: true
asarUnpack:
  - "node_modules/sql.js/**"

win:
  icon: assets/icon.png
  artifactName: "vibetask.${ext}"
  target:
    - target: portable
      arch:
        - x64
