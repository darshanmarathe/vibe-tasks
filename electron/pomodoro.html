<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: rgba(30, 30, 46, 0.95);
    --border: #313244;
    --text: #cdd6f4;
    --text-muted: #a6adc8;
    --text-dim: #585b70;
    --btn-bg: #313244;
    --btn-hover: #45475a;
    --primary: #89b4fa;
    --focus: #a6e3a1;
    --break: #89b4fa;
    --danger: #f38ba8;
    --warn: #f9e2af;
    --input-bg: #1e1e2e;
  }
  [data-theme="light"] {
    --bg: rgba(245, 245, 249, 0.95);
    --border: #d4d4d8;
    --text: #1e1e2e;
    --text-muted: #52525b;
    --text-dim: #a1a1aa;
    --btn-bg: #e8e8ee;
    --btn-hover: #d4d4d8;
    --primary: #3b82f6;
    --focus: #22c55e;
    --break: #3b82f6;
    --danger: #ef4444;
    --warn: #eab308;
    --input-bg: #ffffff;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    color: var(--text);
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }
  .titlebar {
    display: flex;
    justify-content: flex-end;
    gap: 4px;
    padding: 6px 8px 0;
    -webkit-app-region: no-drag;
  }
  .titlebar button {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s;
    opacity: 0.5;
  }
  .titlebar button:hover { opacity: 1; }
  .titlebar .close-btn { background: var(--danger); color: var(--warn); }
  .titlebar .min-btn { background: var(--warn); color: #1e1e2e; }
  .container {
    height: calc(100vh - 32px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 16px 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 4px;
    backdrop-filter: blur(12px);
  }
  .mode {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .mode.focus { color: var(--focus); }
  .mode.break { color: var(--break); }
  .timer {
    font-size: 48px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    margin-bottom: 10px;
    -webkit-app-region: no-drag;
  }
  .controls {
    display: flex;
    gap: 8px;
    -webkit-app-region: no-drag;
  }
  .controls button {
    background: var(--btn-bg);
    border: none;
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .controls button:hover { background: var(--btn-hover); }
  .controls button.primary { background: var(--primary); color: var(--input-bg); }
  .controls button.primary:hover { background: var(--primary); opacity: 0.8; }
  .controls button.danger { color: var(--danger); }
  .sessions {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 8px;
    -webkit-app-region: no-drag;
  }
  .settings {
    display: none;
    margin-top: 10px;
    -webkit-app-region: no-drag;
  }
  .settings.open { display: flex; gap: 8px; }
  .settings label {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 10px;
    color: var(--text-muted);
  }
  .settings input {
    width: 48px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 6px;
    color: var(--text);
    font-size: 12px;
    text-align: center;
    margin-top: 2px;
  }
  .settings input:focus { outline: none; border-color: var(--primary); }
</style>
</head>
<body>
<div class="titlebar">
  <button class="min-btn" id="minBtn" title="Minimize to background">—</button>
  <button class="close-btn" id="closeBtn" title="Close">✕</button>
</div>
<div class="container">
  <div class="mode focus" id="mode">Focus</div>
  <div class="timer" id="timer">25:00</div>
  <div class="controls">
    <button class="danger" id="resetBtn" title="Reset">↺</button>
    <button class="primary" id="toggleBtn" title="Start/Pause">▶</button>
    <button id="settingsBtn" title="Settings">⚙</button>
  </div>
  <div class="settings" id="settings">
    <label>Focus <input type="number" id="focusTime" min="1" max="120" value="25"></label>
    <label>Break <input type="number" id="breakTime" min="1" max="60" value="5"></label>
  </div>
  <div class="sessions" id="sessions">Sessions: 0</div>
</div>

<script>
  ;(async function loadTheme() {
    try {
      const theme = await window.electronAPI.getTheme()
      document.documentElement.setAttribute('data-theme', theme)
    } catch (e) { /* use default dark */ }
  })()

  let focusMinutes = 25
  let breakMinutes = 5
  let secondsLeft = focusMinutes * 60
  let isRunning = false
  let isFocus = true
  let sessionCount = 0
  let interval = null

  const timerEl = document.getElementById('timer')
  const modeEl = document.getElementById('mode')
  const toggleBtn = document.getElementById('toggleBtn')
  const resetBtn = document.getElementById('resetBtn')
  const settingsBtn = document.getElementById('settingsBtn')
  const settingsEl = document.getElementById('settings')
  const focusInput = document.getElementById('focusTime')
  const breakInput = document.getElementById('breakTime')
  const sessionsEl = document.getElementById('sessions')
  const closeBtn = document.getElementById('closeBtn')
  const minBtn = document.getElementById('minBtn')

  function updateDisplay() {
    const mins = Math.floor(secondsLeft / 60)
    const secs = secondsLeft % 60
    timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`
  }

  function setMode(focus) {
    isFocus = focus
    modeEl.textContent = focus ? 'Focus' : 'Break'
    modeEl.className = 'mode ' + (focus ? 'focus' : 'break')
    secondsLeft = (focus ? focusMinutes : breakMinutes) * 60
    updateDisplay()
  }

  function playChime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)()
      const notes = [523.25, 659.25, 783.99]
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator()
        const gain = ctx.createGain()
        osc.type = 'sine'
        osc.frequency.value = freq
        gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15)
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.5)
        osc.connect(gain)
        gain.connect(ctx.destination)
        osc.start(ctx.currentTime + i * 0.15)
        osc.stop(ctx.currentTime + i * 0.15 + 0.5)
      })
    } catch (e) { /* audio not available */ }
  }

  function showNotification(title, body) {
    try {
      if (window.electronAPI && window.electronAPI.notify) {
        window.electronAPI.notify(title, body)
      } else {
        new Notification(title, { body })
      }
    } catch (e) { /* notification not available */ }
  }

  async function playXylophone() {
    try {
      const soundPath = await window.electronAPI.getSoundPath()
      if (!soundPath) { playChime(); return }
      const audio = new Audio(soundPath)
      audio.volume = 0.5
      await audio.play()
    } catch (e) {
      playChime()
    }
  }

  function switchMode() {
    if (isFocus) {
      sessionCount++
      sessionsEl.textContent = 'Sessions: ' + sessionCount
      playXylophone()
      showNotification('Focus Complete!', 'Time for a break. ☕')
      setMode(false)
    } else {
      playXylophone()
      showNotification('Break Over!', 'Time to focus. 🎯')
      setMode(true)
    }
    isRunning = false
    toggleBtn.textContent = '▶'
  }

  function tick() {
    secondsLeft--
    updateDisplay()
    if (secondsLeft <= 0) {
      clearInterval(interval)
      interval = null
      switchMode()
    }
  }

  function toggleTimer() {
    if (isRunning) {
      clearInterval(interval)
      interval = null
      isRunning = false
      toggleBtn.textContent = '▶'
    } else {
      isRunning = true
      toggleBtn.textContent = '⏸'
      interval = setInterval(tick, 1000)
    }
  }

  function resetTimer() {
    clearInterval(interval)
    interval = null
    isRunning = false
    toggleBtn.textContent = '▶'
    setMode(isFocus)
  }

  function applySettings() {
    focusMinutes = Math.max(1, parseInt(focusInput.value) || 25)
    breakMinutes = Math.max(1, parseInt(breakInput.value) || 5)
    if (!isRunning) setMode(isFocus)
  }

  toggleBtn.addEventListener('click', toggleTimer)
  resetBtn.addEventListener('click', resetTimer)
  settingsBtn.addEventListener('click', () => {
    settingsEl.classList.toggle('open')
  })
  focusInput.addEventListener('change', applySettings)
  breakInput.addEventListener('change', applySettings)

  closeBtn.addEventListener('click', () => {
    try { window.electronAPI.close() } catch(e) { /* close not available */ }
  })
  minBtn.addEventListener('click', () => {
    try { window.electronAPI.minimize() } catch(e) { /* minimize not available */ }
  })

  updateDisplay()
</script>
</body>
</html>
